<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Common Ground Travel | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Russo+One&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Common Ground Travel</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Destination</a></li>
            <li><a href="videos.html">Video</a></li>
            <li><a href="packages.html">Packages</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2>Contact Us</h2>
    <form action="thanks.html">
        <fieldset>
            <legend>Your Information</legend>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="dest">Destination Interest</label>
            <select id="dest" name="dest">
                <option value="tokyo">Tokyo</option>
                <option value="amalfi">Amalfi Coast</option>
                <option value="zion">Zion</option>
            </select>

            <p>Preferred Contact Method:</p>
            <div class="radio-group">
                <input type="radio" id="remail" name="contact" value="email" checked>
                <label for="remail">Email</label>
                <input type="radio" id="rphone" name="contact" value="phone">
                <label for="rphone">Phone</label>
                <input type="radio" id="rtext" name="contact" value="text">
                <label for="rtext">Text</label>
            </div>

            <label for="msg">Comments</label>
            <textarea id="msg" name="msg" rows="4"></textarea>

            <button type="submit" class="submit-btn">Send Request</button>
        </fieldset>
    </form>
</main>

<footer>
    <p>&copy; 2026 Common Ground Travel | Designed by Ana Pinto</p>
</footer> 
    
</body>
</html>
